<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Motor de Validación de Cumplimiento Documental — PluriOne S.A. de C.V."
    />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Motor de Validación de Cumplimiento Documental</title>
    <script>
      /* Resuelve el tema antes del primer pintado para que no haya destello
         al recargar. El tema claro es el predeterminado; la clave v2 descarta
         la preferencia guardada con el diseño anterior (oscuro por defecto). */
      (function () {
        var tema = 'light'
        try {
          var guardado = localStorage.getItem('plurione-theme-v2')
          if (guardado === 'dark' || guardado === 'light') tema = guardado
        } catch (e) {
          /* almacenamiento bloqueado: se queda el tema por defecto */
        }
        document.documentElement.setAttribute('data-theme', tema)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
