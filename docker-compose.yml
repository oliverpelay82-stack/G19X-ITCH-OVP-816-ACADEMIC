networks:
  plurione-net:
    driver: bridge

volumes:
  plurione_pgdata:
  # Texto extraído por el Nivel 3 (SQLite): evita repetir el OCR tras reiniciar.
  plurione_ai_data:

services:
  plurione-db:
    image: postgres:17-alpine
    container_name: plurione-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: plurione-demo
      POSTGRES_DB: plurione_compliance
    ports:
      - "5433:5432"
    volumes:
      - plurione_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plurione-net

  plurione-core:
    build:
      context: ./services/core-service
    container_name: plurione-core
    ports:
      - "8001:8001"
    environment:
      DB_HOST: plurione-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: plurione-demo
      DB_NAME: plurione_compliance
      STORAGE_VAULT_PATH: /app/storage_vault
      # Documentos obligatorios del expediente (reglas RIE activas, HU-09).
      RULES_BASE_URL: http://plurione-rules:8002
    volumes:
      - ./storage_vault:/app/storage_vault
    depends_on:
      plurione-db:
        condition: service_healthy
    networks:
      - plurione-net

  plurione-rules:
    build:
      context: ./services/rules-service
    container_name: plurione-rules
    ports:
      - "8002:8002"
    environment:
      DB_HOST: plurione-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: plurione-demo
      DB_NAME: plurione_compliance
      # Precarga idempotente del catálogo DOC-05 al arrancar (solo inserta las reglas que falten).
      AUTO_SEED: "true"
    depends_on:
      plurione-db:
        condition: service_healthy
    networks:
      - plurione-net

  plurione-ai:
    build:
      context: ./services/ai-service
    container_name: plurione-ai
    ports:
      - "8003:8003"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: qwen/qwen3.8-27b
      OCR_LANG: spa
      TESSERACT_CMD: /usr/bin/tesseract
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      CORE_BASE_URL: http://plurione-core:8001
      RULES_BASE_URL: http://plurione-rules:8002
    # Sin la bóveda: el ai-service lee cada binario por el core, que verifica su huella (RIE-03).
    volumes:
      - plurione_ai_data:/app/data
    depends_on:
      - plurione-core
      - plurione-rules
    networks:
      - plurione-net

  plurione-frontend:
    build:
      context: ./frontend
    container_name: plurione-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - plurione-core
      - plurione-rules
      - plurione-ai
    networks:
      - plurione-net

